<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FinTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="auth-logo">₹</div>
      <h1>FinTrack</h1>
      <p>Personal Finance Management System</p>
    </div>

    <div class="auth-card">
      <h2>Sign In to Your Account</h2>

      <!-- Inline Error Alert Message -->
      <div id="errorAlert" class="alert alert-error" style="display: none;" role="alert">
        <span class="alert-icon">⚠️</span>
        <span id="errorMessage" class="alert-text"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Redirect if session already exists
      await redirectIfAuthenticated();

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const loginBtn = document.getElementById("loginBtn");
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");

      // Password visibility toggle
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          togglePasswordBtn.classList.toggle("is-visible", isPassword);
          const label = isPassword ? "Hide password" : "Show password";
          togglePasswordBtn.setAttribute("aria-label", label);
          togglePasswordBtn.setAttribute("title", label);
        });
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.style.display = "flex";
      }

      function hideError() {
        errorAlert.style.display = "none";
        errorMessage.textContent = "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Client-side validation
        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        try {
          loginBtn.disabled = true;
          loginBtn.textContent = "Signing In...";

          await login(email, password);

          // On successful authentication, redirect to dashboard
          window.location.href = "dashboard.html";
        } catch (error) {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign In";

          if (error.status === 401) {
            showError("Invalid email or password.");
          } else {
            showError(error.message || "Failed to sign in. Please try again.");
          }
        }
      });
    });
  </script>
</body>
</html>
