<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FinTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="auth-logo">₹</div>
      <h1>FinTrack</h1>
      <p>Personal Finance Management System</p>
    </div>

    <div class="auth-card">
      <h2>Sign In to Your Account</h2>

      <!-- Inline Error Alert Message -->
      <div id="errorAlert" class="alert alert-error" style="display: none;" role="alert">
        <span class="alert-icon">⚠️</span>
        <span id="errorMessage" class="alert-text"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Redirect if session already exists
      await redirectIfAuthenticated();

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");

      function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.style.display = "flex";
      }

      function hideError() {
        errorAlert.style.display = "none";
        errorMessage.textContent = "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Client-side validation
        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        try {
          loginBtn.disabled = true;
          loginBtn.textContent = "Signing In...";

          await login(email, password);

          // On successful authentication, redirect to dashboard
          window.location.href = "dashboard.html";
        } catch (error) {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign In";

          if (error.status === 401) {
            showError("Invalid email or password.");
          } else {
            showError(error.message || "Failed to sign in. Please try again.");
          }
        }
      });
    });
  </script>
</body>
</html>
