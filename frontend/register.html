<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – FinTrack</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="auth-logo">₹</div>
      <h1>FinTrack</h1>
      <p>Personal Finance Management System</p>
    </div>

    <div class="auth-card">
      <h2>Create Your Account</h2>

      <!-- Inline Error Alert Message -->
      <div id="errorAlert" class="alert alert-error" style="display: none;" role="alert">
        <span class="alert-icon">⚠️</span>
        <span id="errorMessage" class="alert-text"></span>
      </div>

      <!-- Inline Success Alert Message -->
      <div id="successAlert" class="alert alert-success" style="display: none;" role="alert">
        <span class="alert-icon">✓</span>
        <span id="successMessage" class="alert-text"></span>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name <span class="text-muted">*</span></label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="Avinash Menon" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="text-muted">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="avinash@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number <span class="text-muted">(Optional)</span></label>
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phone_number" 
            class="form-control" 
            placeholder="+91 9876543210" 
            autocomplete="tel"
          >
        </div>

        <div class="form-group">
          <label for="password">Password <span class="text-muted">*</span></label>
          <div class="password-input-wrapper" style="position: relative; width: 100%; display: block;">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password"
              style="padding-right: 45px; width: 100%; box-sizing: border-box;"
            >
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 0; margin: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; z-index: 2;"
            >
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="form-text">Must be at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password <span class="text-muted">*</span></label>
          <div class="password-input-wrapper" style="position: relative; width: 100%; display: block;">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirm_password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password"
              style="padding-right: 45px; width: 100%; box-sizing: border-box;"
            >
            <button 
              type="button" 
              id="toggleConfirmPasswordBtn" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 0; margin: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; z-index: 2;"
            >
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary btn-block">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="index.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Redirect if session already exists
      await redirectIfAuthenticated();

      const form = document.getElementById("registerForm");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const phoneInput = document.getElementById("phoneNumber");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const registerBtn = document.getElementById("registerBtn");
      
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");
      const successAlert = document.getElementById("successAlert");
      const successMessage = document.getElementById("successMessage");

      // Password visibility toggles
      function setupPasswordToggle(toggleBtnId, input) {
        const toggleBtn = document.getElementById(toggleBtnId);
        if (!toggleBtn || !input) return;

        toggleBtn.addEventListener("click", () => {
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          toggleBtn.classList.toggle("is-visible", isPassword);
          const label = isPassword ? "Hide password" : "Show password";
          toggleBtn.setAttribute("aria-label", label);
          toggleBtn.setAttribute("title", label);
        });
      }

      setupPasswordToggle("togglePasswordBtn", passwordInput);
      setupPasswordToggle("toggleConfirmPasswordBtn", confirmPasswordInput);

      function showError(msg) {
        successAlert.style.display = "none";
        errorMessage.textContent = msg;
        errorAlert.style.display = "flex";
      }

      function showSuccess(msg) {
        errorAlert.style.display = "none";
        successMessage.textContent = msg;
        successAlert.style.display = "flex";
      }

      function hideAlerts() {
        errorAlert.style.display = "none";
        successAlert.style.display = "none";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlerts();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phoneNumber = phoneInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Client-side validations
        if (!name) {
          showError("Full name is required.");
          nameInput.focus();
          return;
        }

        if (!email || !isValidEmail(email)) {
          showError("Please enter a valid email address.");
          emailInput.focus();
          return;
        }

        if (!password) {
          showError("Password is required.");
          passwordInput.focus();
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters long.");
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showError("Passwords do not match. Please re-enter.");
          confirmPasswordInput.focus();
          return;
        }

        try {
          registerBtn.disabled = true;
          registerBtn.textContent = "Creating Account...";

          await register({
            name,
            email,
            password,
            phone_number: phoneNumber
          });

          // Show success message and redirect
          showSuccess("Account created successfully. Redirecting to login...");
          form.reset();

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);

        } catch (error) {
          registerBtn.disabled = false;
          registerBtn.textContent = "Create Account";

          if (error.status === 409) {
            showError("An account with this email already exists.");
          } else {
            showError(error.message || "Failed to create account. Please try again.");
          }
        }
      });
    });
  </script>
</body>
</html>
